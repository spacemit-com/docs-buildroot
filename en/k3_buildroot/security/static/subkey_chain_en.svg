<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 600" role="img" aria-labelledby="title desc"><title id="title">Storage-key hierarchy and RPMB authentication key</title><desc id="desc">HUK derives an RPMB authentication key and the SSK, TSK, and FEK storage-key hierarchy.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#566170"/></marker></defs><rect width="1760" height="600" fill="white"/>
<g fill="#dfd0ef" stroke="#7855b2" stroke-width="2.5"><rect x="70" y="46" width="470" height="112"/><rect x="70" y="300" width="470" height="136"/><rect x="720" y="46" width="470" height="112"/><rect x="720" y="230" width="470" height="112"/><rect x="720" y="414" width="470" height="112"/></g>
<g stroke="#566170" stroke-width="2.5" fill="none" marker-end="url(#a)"><path d="M540 102 H712"/><path d="M305 158 V292"/><path d="M955 158 V222"/><path d="M955 342 V406"/></g>
<g font-family="Arial,sans-serif" text-anchor="middle" fill="#302154"><text x="305" y="92" font-size="26" font-weight="bold">HUK (eFuse bank 1)</text><text x="305" y="130" font-size="22">Inside the engine only</text><text x="305" y="342" font-size="26" font-weight="bold">RPMB authentication key</text><text x="305" y="378" font-size="22">+ device identifier</text><text x="305" y="412" font-size="22">Cannot change after provisioning</text><text x="955" y="92" font-size="26" font-weight="bold">SSK</text><text x="955" y="130" font-size="22">One per device</text><text x="955" y="276" font-size="26" font-weight="bold">TSK</text><text x="955" y="314" font-size="22">One per TA</text><text x="955" y="460" font-size="26" font-weight="bold">FEK</text><text x="955" y="498" font-size="22">One per secure object</text></g>
<g font-family="Arial,sans-serif" font-size="20" fill="#566170"><text x="556" y="84">usage = 1 (SSK)</text><text x="325" y="236">usage = 0 (RPMB)</text><text x="985" y="198">+ TA UUID</text><text x="985" y="382">+ object identifier</text><text x="1220" y="108">SSK: derived from HUK, one per device</text><text x="1220" y="292">TSK: derived from SSK and TA UUID</text><text x="1220" y="476">FEK: one per object; encrypted FEK</text><text x="1220" y="504">stored in object header</text></g>
<text x="70" y="568" font-family="Arial,sans-serif" font-size="22" fill="#17202b">Conclusion: data cannot be unsealed on another device (SSK is fuse-bound); TAs cannot access each other's storage (TSKs differ).</text></svg>
