<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 848" role="img" aria-labelledby="title desc">
<title id="title">Key hierarchy overview</title><desc id="desc">eFuse branches into Secure Boot and TEE key chains. HUK-derived keys include storage, RPMB, TA encryption and device identity keys.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#566170"/></marker></defs>
<rect width="1320" height="848" fill="white"/>
<g stroke="#566170" stroke-width="3" fill="none"><path d="M660 120 V176 H290 V228 M660 176 H1030 V228 M1030 336 V392 M1030 472 V536 H804 V778"/><path d="M804 538 H750 M804 618 H750 M804 698 H750 M804 778 H750" marker-end="url(#arrow)"/><path d="M290 210 V228 M1030 210 V228 M1030 374 V392 M1030 518 V536" marker-end="url(#arrow)"/></g>
<g stroke-width="2.5"><g fill="#d9dae0" stroke="#777982"><rect x="430" y="44" width="460" height="76"/><rect x="90" y="228" width="400" height="108"/></g><g fill="#dfd0ef" stroke="#7855b2"><rect x="830" y="228" width="400" height="108"/><rect x="830" y="392" width="400" height="80"/><rect x="90" y="508" width="660" height="60"/><rect x="90" y="588" width="660" height="60"/><rect x="90" y="668" width="660" height="60"/><rect x="90" y="748" width="660" height="60"/></g><rect x="148" y="360" width="155" height="40" fill="#f3d1cc" stroke="#bc5551"/><rect x="1112" y="488" width="90" height="40" fill="#c3e5d0" stroke="#468b61"/></g>
<g font-family="Arial,sans-serif" text-anchor="middle" fill="#302154" font-size="22" font-weight="bold"><text x="660" y="90" fill="#17202b">eFuse: one-time programmable (OTP)</text><text x="290" y="273" fill="#17202b">RoT public-key hash</text><text x="290" y="309" fill="#17202b" font-weight="normal">Verifies the first boot-chain stage</text><text x="1030" y="268">eFuse bank 1 (programmed by SoC vendor)</text><text x="1030" y="306" font-weight="normal">Unique to each chip</text><text x="1030" y="442">HUK (root key in eFuse)</text><text x="420" y="547">Storage keys: SSK → TSK → FEK</text><text x="420" y="627">RPMB authentication key (with device identifier)</text><text x="420" y="707">TA encryption key</text><text x="420" y="787">Device identity</text><text x="226" y="387" fill="#742621" font-size="19">Secure Boot</text><text x="1157" y="515" fill="#164b31" font-size="19">TEE</text></g>
<text x="806" y="440" font-family="Arial,sans-serif" text-anchor="end" font-size="18" fill="#566170">Root key unreadable; subkeys derived by engine</text>
</svg>