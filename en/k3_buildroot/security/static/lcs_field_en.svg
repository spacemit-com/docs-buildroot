<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 488" role="img" aria-labelledby="title desc"><title id="title">eFuse bank 6 lifecycle fields</title><desc id="desc">The LCS fields use majority voting and precedence RMA, SP, DM, CM; unclassifiable states reject boot.</desc><rect width="1760" height="488" fill="white"/><text x="80" y="112" font-family="Arial,sans-serif" font-size="23" fill="#17202b">eFuse bank 6: bytes 4–7 (32-bit word)</text><g stroke-width="2.5"><g fill="#dfd0ef" stroke="#7855b2"><rect x="80" y="152" width="150" height="104"/><rect x="230" y="152" width="150" height="104"/><rect x="380" y="152" width="150" height="104"/><rect x="530" y="152" width="150" height="104"/><rect x="680" y="152" width="400" height="104"/></g><rect x="1080" y="152" width="600" height="104" fill="#d9dae0" stroke="#777982"/></g><g font-family="Arial,sans-serif" text-anchor="middle" fill="#17202b" font-size="23" font-weight="bold"><text x="155" y="198">CM</text><text x="305" y="198">DM</text><text x="455" y="198">SP</text><text x="605" y="198">RMA</text><text x="880" y="198">DFT</text><text x="1380" y="198">Reserved</text><g font-size="19" font-weight="normal"><text x="155" y="234">3 bits</text><text x="305" y="234">3 bits</text><text x="455" y="234">3 bits</text><text x="605" y="234">3 bits</text><text x="880" y="234">8 bits</text><text x="1380" y="234">12 bits</text><text x="155" y="296">bits 32–34</text><text x="305" y="296">bits 35–37</text><text x="455" y="296">bits 38–40</text><text x="605" y="296">bits 41–43</text><text x="880" y="296">bits 44–51</text><text x="1380" y="296">bits 52–63</text></g></g><g font-family="Arial,sans-serif" font-size="20" fill="#17202b"><text x="80" y="352">A group takes effect when at least two bits are 1 (majority voting tolerates a single programming error).</text><text x="80" y="397">If multiple groups are active: RMA &gt; SP &gt; DM &gt; CM; all zeros are treated as CM.</text><text x="80" y="441">An unclassifiable state rejects boot; transitions are irreversible and require programming bits.</text></g></svg>