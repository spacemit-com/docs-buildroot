<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 765" role="img" aria-labelledby="title desc"><title id="title">Lifecycle progression and boot gate</title><desc id="desc">New Chip progresses through CM, DM and SP; SP can transition irreversibly to RMA. Boot conditions are shown for each state.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#566170"/></marker></defs><rect width="1800" height="765" fill="white"/>
<text x="56" y="62" font-family="Arial,sans-serif" font-size="20" fill="#566170">Progression by programming bits; irreversible</text>
<g stroke-width="3"><g fill="#dfd0ef" stroke="#7855b2"><rect x="57" y="86" width="379" height="176"/><rect x="493" y="86" width="379" height="176"/><rect x="929" y="86" width="379" height="176"/><rect x="1365" y="86" width="379" height="176"/></g><rect x="471" y="338" width="858" height="162" fill="#f3d1cc" stroke="#bc5551"/><g fill="#c3e5d0" stroke="#468b61"><rect x="57" y="580" width="323" height="159"/><rect x="1079" y="580" width="323" height="159"/></g><g fill="#f4e0b1" stroke="#b98c38"><rect x="398" y="580" width="323" height="159"/><rect x="739" y="580" width="323" height="159"/></g><rect x="1420" y="580" width="323" height="159" fill="#f3d1cc" stroke="#bc5551"/></g>
<g stroke="#566170" stroke-width="3" fill="none" marker-end="url(#a)"><path d="M440 174 H489"/><path d="M876 174 H925"/><path d="M1312 174 H1361"/><path d="M1554 262 V290 H900 V334"/></g>
<g font-family="Arial,sans-serif" text-anchor="middle" font-size="21" fill="#302154"><g font-weight="bold" font-size="23"><text x="246" y="126">New Chip (all 0)</text><text x="682" y="126">CM</text><text x="1118" y="126">DM</text><text x="1554" y="126">SP</text></g><text x="246" y="164">Not yet in manufacturing</text><text x="246" y="200">Fuses empty</text><text x="246" y="236">Readable / writable</text><text x="682" y="164">Chip manufacturing</text><text x="682" y="200">Provision configuration assets</text><text x="682" y="236">Readable / writable</text><text x="1118" y="164">Device manufacturing</text><text x="1118" y="200">Configuration assets provisioned</text><text x="1118" y="236" font-size="18">Secret roots usable only; others read/write</text><text x="1554" y="164">Secure product</text><text x="1554" y="200">Debug disable: not yet supported</text><text x="1554" y="236" font-size="18">Secret roots usable only; others read/write</text><text x="900" y="378" font-weight="bold" fill="#742621">RMA (Return Material Authorization)</text><text x="900" y="414" fill="#742621">Downgraded state; irreversible</text><text x="900" y="450" fill="#742621">Secret roots (HUK/SSK) unavailable</text><text x="900" y="486" fill="#742621">JTAG re-enabled; boot checks image header only</text></g>
<g font-family="Arial,sans-serif" font-size="20" fill="#566170"><text x="910" y="314">Authorized repair: downgrade, irreversible</text><text x="56" y="556" fill="#17202b">Boot gate (decided at startup; boot stops if the check fails)</text></g>
<g font-family="Arial,sans-serif" text-anchor="middle" font-size="21"><g fill="#164b31"><text x="218" y="634" font-weight="bold">CM</text><text x="218" y="670">Allow</text><text x="218" y="706">Print one warning</text><text x="1240" y="634" font-weight="bold">RMA</text><text x="1240" y="670">Allow</text><text x="1240" y="706">Warn on every boot</text></g><g fill="#664716"><text x="559" y="634" font-weight="bold">DM</text><text x="559" y="670">Requires chip_id</text><text x="559" y="706">Empty root: allow + warning</text><text x="900" y="622" font-weight="bold">SP</text><text x="900" y="658">Requires chip_id + HUK</text><text x="900" y="690">+ secure-boot fuse</text><text x="900" y="722">+ locked root banks</text></g><g fill="#742621"><text x="1581" y="652" font-weight="bold">Undefined</text><text x="1581" y="690">Reject boot</text></g></g></svg>
