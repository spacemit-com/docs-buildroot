<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 925" role="img" aria-labelledby="title desc">
<title id="title">HUK subordinate-key derivation</title><desc id="desc">Three AES decryption stages in the security engine derive a working key, followed by CMAC and counter-mode KDF for six purposes.</desc>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#566170"/></marker></defs><rect width="1760" height="925" fill="white"/>
<rect x="80" y="172" width="720" height="368" fill="none" stroke="#abb5c3" stroke-width="2" stroke-dasharray="10 8"/><rect x="105" y="151" width="155" height="41" fill="#dddde1" stroke="#777982" stroke-width="2"/>
<g stroke-width="2.5"><rect x="120" y="40" width="640" height="92" fill="#d9dae0" stroke="#777982"/><g fill="#dfd0ef" stroke="#7855b2"><rect x="140" y="200" width="600" height="80"/><rect x="140" y="316" width="600" height="80"/><rect x="140" y="432" width="600" height="80"/><rect x="110" y="800" width="245" height="72"/><rect x="368" y="800" width="245" height="72"/><rect x="626" y="800" width="245" height="72"/><rect x="884" y="800" width="245" height="72"/><rect x="1142" y="800" width="245" height="72"/><rect x="1400" y="800" width="245" height="72"/></g><rect x="120" y="600" width="640" height="96" fill="#c3e5d0" stroke="#468b61"/></g>
<g fill="none" stroke="#566170" stroke-width="2.5" marker-end="url(#a)"><path d="M440 132 V198 M440 280 V314 M440 396 V430 M440 512 V598"/><path d="M440 696 V760 H232 V798 M440 760 H490 V798 M440 760 H748 V798 M440 760 H1006 V798 M440 760 H1264 V798 M440 760 H1522 V798"/></g>
<g font-family="Arial,sans-serif" text-anchor="middle" font-size="24" font-weight="bold" fill="#302154"><text x="440" y="79" fill="#17202b">HUK (eFuse bank 1)</text><text x="440" y="113" fill="#17202b" font-weight="normal" font-size="21">Unreadable by software; used only by the engine</text><text x="182" y="179" fill="#17202b" font-size="19">Security engine</text><text x="440" y="250">AES-Dec(HUK, ek3) → WK3</text><text x="440" y="366">AES-Dec(WK3, ek2) → WK2</text><text x="440" y="482">AES-Dec(WK2, ek1) → WK</text><text x="440" y="641" fill="#164b31">CMAC-PRF (SP 800-38B)</text><text x="440" y="676" fill="#164b31" font-weight="normal">+ SP 800-108 counter-mode KDF</text><text x="232" y="845">RPMB</text><text x="490" y="845">SSK</text><text x="748" y="845">DIE_ID</text><text x="1006" y="845">UNIQUE_TA</text><text x="1264" y="845">TA_ENC</text><text x="1522" y="845">SE050</text></g>
<g font-family="Arial,sans-serif" font-size="20" fill="#566170"><text x="860" y="224">eks = ek3||ek2||ek1 (48 B, public constant)</text><text x="860" y="280">HUK and WK3 / WK2 / WK exist only inside the engine</text><text x="860" y="336">Software supplies only eks and data; it reads back only ciphertext</text><text x="860" y="392">WK (working key): 128 / 256 bits</text><text x="860" y="628">input = LABEL || [const_data || 0x00] || usage || len_bits</text><text x="860" y="680">subkey_len ≤ 32 B</text><text x="860" y="732">LABEL / format cannot change after release; no software fallback</text></g>
</svg>